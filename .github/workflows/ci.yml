name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Formatting
        run: |
          diff="$(golangci-lint fmt --diff ./...)"
          test -z "$diff" || { echo "$diff"; echo "run make fmt" >&2; exit 1; }
      - name: go.mod is tidy
        run: go mod tidy -diff

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - name: Build every release platform
        run: make cross

  npm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 24] # package.json engines floor and current
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: make npm-test
